services:
  - type: web
    name: questforge
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: QUESTFORGE_OPERATOR_TOKEN
        sync: false
      - key: QUESTFORGE_RETENTION_DAYS
        value: 30
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_STANDARD
        sync: false
      - key: PADDLE_PRICE_LARGE
        sync: false
      - key: PADDLE_PRICE_MONTHLY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: 3000
